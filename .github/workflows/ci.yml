name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests and syntax checks
        run: npm run check

      - name: Rebuild published site
        run: npm run build

      - name: Verify committed output is current
        run: git diff --exit-code -- docs
